    .woof { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 28px; font-weight: 700; fill: #2b2b2b; text-anchor: middle; }
  </style>

  <rect width="1200" height="630" fill="#fbf3e4"/>
  <ellipse cx="600" cy="540" rx="560" ry="22" fill="#eadcbf"/>

