name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Run Go tests
        run: go test ./...

  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, nixos]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Build package and release binary
        run: |
          nix build .#default --out-link result-package
          nix build .#linuxBinary --out-link result-binary
          cp result-binary/sacha.house-linux-amd64 sacha.house-linux-amd64
          sha256sum sacha.house-linux-amd64 > sacha.house-linux-amd64.sha256
      - name: Build container image
        run: nix build .#dockerImage --out-link result-image
      - name: Push build outputs to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push sachahjkl result-package result-binary result-image
      - name: Push container image
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          nix run nixpkgs#skopeo -- copy --insecure-policy \
            --dest-creds "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            docker-archive:result-image \
            "docker://${image}:${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            nix run nixpkgs#skopeo -- copy --insecure-policy \
              --dest-creds "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              docker-archive:result-image \
              "docker://${image}:latest"
          fi
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          binary_version="$(./sacha.house-linux-amd64 --version)"
          if [[ "$binary_version" != "$release_version" ]]; then
            printf 'tag version %s does not match binary version %s\n' "$release_version" "$binary_version" >&2
            exit 1
          fi
          nix run nixpkgs#gh -- release create "$GITHUB_REF_NAME" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            sacha.house-linux-amd64 sacha.house-linux-amd64.sha256
