[project]
name = "sacha-house"
revision = "1.0"

[providers]
production_sops = "sops://secrets/{project}/{profile}.yaml"

[profiles.default]
GITLAB_BEARER_TOKEN = { description = "GitLab API token", required = false }
GITHUB_BEARER_TOKEN = { description = "GitHub API token", required = false }
ADMIN_PASSWORD_HASH = { description = "Argon2id administrator password hash", required = false }
ADMIN_PASSWORD_PEPPER = { description = "Administrator password pepper", required = false }
PASTE_SECRETS_FILE = { description = "Paste encryption keys and GitHub Gist token", required = false, as_path = true }

[profiles.production.defaults]
providers = ["production_sops"]
required = true

[profiles.production]
GITLAB_BEARER_TOKEN = { required = true }
GITHUB_BEARER_TOKEN = { required = true }
ADMIN_PASSWORD_HASH = { required = true }
ADMIN_PASSWORD_PEPPER = { required = true }
PASTE_SECRETS_FILE = { required = true }

[scopes.runtime]
secrets = [
  "GITLAB_BEARER_TOKEN",
  "GITHUB_BEARER_TOKEN",
  "ADMIN_PASSWORD_HASH",
  "ADMIN_PASSWORD_PEPPER",
  "PASTE_SECRETS_FILE",
]
