stages:
  - build
  - release

variables:
  ARTIFACT_NAME: "sacha.house-linux-amd64"
  ODIN_VERSION: "dev-2025-09"

build:linux:
  stage: build
  image: archlinux:base-devel
  before_script:
    - pacman -Syu --noconfirm clang openssl make libbacktrace git unzip tar curl
    - curl -L https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.zip -o odin.zip
    - unzip odin.zip -d /tmp
    - tar -C /opt -xzf /tmp/dist.tar.gz
    - ln -s /opt/odin-linux-amd64-nightly+2025-09-08/odin /usr/local/bin/odin
    - curl -fsSL https://bun.sh/install | bash -s "bun-v1.2.19"
    - export PATH="/root/.bun/bin:$PATH"
  script:
    - export VERSION_TAG="$(date +%Y.%m.%d).${CI_PIPELINE_IID}"
    - echo "VERSION_TAG=$VERSION_TAG" >> build.env
    - bun install --production
    - make build mode=release GIT_COMMIT_HASH=$CI_COMMIT_SHORT_SHA VERSION_TAG=$VERSION_TAG
    - mv sacha.house.exe ${ARTIFACT_NAME}
    - chmod +x ${ARTIFACT_NAME}
  artifacts:
    paths:
      - ${ARTIFACT_NAME}
    reports:
      dotenv: build.env
    expire_in: 1 week
  only:
    - master

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:linux
      artifacts: true
  script:
    - echo "Creating release $VERSION_TAG for sacha.house"
  release:
    name: "sacha.house $VERSION_TAG"
    tag_name: "$VERSION_TAG"
    description: "sacha.house automated release $VERSION_TAG from commit $CI_COMMIT_SHORT_SHA"
    assets:
      links:
        - name: "sacha.house Linux AMD64 Binary"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${ARTIFACT_NAME}?job=build:linux"
          link_type: "package"
  only:
    - master
