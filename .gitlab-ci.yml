{
  "stages": [
    "build",
    "release"
  ],
  "workflow": {
    "rules": [
      {
        "if": '$CI_COMMIT_BRANCH == "master"',
        "when": "always"
      },
      {
        "when": "never"
      }
    ]
  },
  "variables": {
    "ARTIFACT_NAME": "sacha.house-linux-amd64",
    "DOCKER_IMAGE_ARTIFACT": "sacha.house-docker-image.tar.gz",
    "ODIN_RELEASE_VERSION": "dev-2026-04",
    "ODIN_NIGHTLY_URL": "",
    "BUN_VERSION": "1.3.5",
    "PATH": "/root/.bun/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin",
    "NIX_CONFIG": "experimental-features = nix-command flakes"
  },
  "build:linux:release": {
    "stage": "build",
    "image": "debian:bookworm",
    "rules": [
      {
        "if": '$ODIN_RELEASE_VERSION != null && $ODIN_RELEASE_VERSION != ""',
        "when": "on_success"
      }
    ],
    "before_script": [
      "apt-get update",
      "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash build-essential clang libssl-dev git unzip tar curl lld libcmark-dev ca-certificates findutils",
      "curl -L https://github.com/odin-lang/Odin/releases/download/${ODIN_RELEASE_VERSION}/odin-linux-amd64-${ODIN_RELEASE_VERSION}.tar.gz -o odin.tar.gz",
      "tar -C /opt -xzf odin.tar.gz",
      'ln -sf $(find /opt -maxdepth 1 -type d -name "odin-linux-amd64*" | head -n 1)/odin /usr/local/bin/odin',
      'curl -fsSL https://bun.sh/install | bash -s -- "bun-v${BUN_VERSION}"',
      "mkdir -p bin/tools bin/release/x86_64"
    ],
    "script": [
      "export VERSION=$(date +%Y.%m.%d)+${CI_COMMIT_SHORT_SHA}",
      'echo "VERSION=$VERSION" >> build.env',
      "bun install --production",
      "odin build lib/temple/cli -o:speed -out:bin/tools/temple_cli.exe",
      "./bin/tools/temple_cli.exe src lib/temple",
      "bun run build:css",
      "GIT_COMMIT_HASH=$CI_COMMIT_SHORT_SHA VERSION=$VERSION odin build src -out:bin/release/x86_64/sacha.house.exe -define:GIT_COMMIT_HASH=\"'$CI_COMMIT_SHORT_SHA'\" -define:VERSION=\"$VERSION\" -collection:lib=lib -o:speed -define:TRACK_LEAKS=false -build-mode:exe",
      "mv bin/release/x86_64/sacha.house.exe ${ARTIFACT_NAME}",
      "chmod +x ${ARTIFACT_NAME}"
    ],
    "artifacts": {
      "paths": [
        "${ARTIFACT_NAME}"
      ],
      "reports": {
        "dotenv": "build.env"
      },
      "expire_in": "1 week"
    }
  },
  "build:linux:nightly": {
    "stage": "build",
    "image": "debian:bookworm",
    "rules": [
      {
        "if": '$ODIN_NIGHTLY_URL != null && $ODIN_NIGHTLY_URL != ""',
        "when": "on_success"
      }
    ],
    "before_script": [
      "apt-get update",
      "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash build-essential clang libssl-dev git unzip tar curl lld libcmark-dev ca-certificates findutils",
      'curl -L "${ODIN_NIGHTLY_URL}" -o odin.tar.gz',
      "tar -C /opt -xzf odin.tar.gz",
      'ln -sf $(find /opt -maxdepth 1 -type d -name "odin-linux-amd64*" | head -n 1)/odin /usr/local/bin/odin',
      'curl -fsSL https://bun.sh/install | bash -s -- "bun-v${BUN_VERSION}"',
      "mkdir -p bin/tools bin/release/x86_64"
    ],
    "script": [
      "export VERSION=$(date +%Y.%m.%d)-nightly+${CI_COMMIT_SHORT_SHA}",
      "echo VERSION=$VERSION >> build.env",
      "bun install --production",
      "odin build lib/temple/cli -o:speed -out:bin/tools/temple_cli.exe",
      "./bin/tools/temple_cli.exe src lib/temple",
      "bun run build:css",
      "GIT_COMMIT_HASH=$CI_COMMIT_SHORT_SHA VERSION=$VERSION odin build src -out:bin/release/x86_64/sacha.house.exe -define:GIT_COMMIT_HASH=\"'$CI_COMMIT_SHORT_SHA'\" -define:VERSION=\"$VERSION\" -collection:lib=lib -o:speed -define:TRACK_LEAKS=false -build-mode:exe",
      "mv bin/release/x86_64/sacha.house.exe ${ARTIFACT_NAME}",
      "chmod +x ${ARTIFACT_NAME}"
    ],
    "artifacts": {
      "paths": [
        "${ARTIFACT_NAME}"
      ],
      "reports": {
        "dotenv": "build.env"
      },
      "expire_in": "1 week"
    }
  },
  "build:docker:image": {
    "stage": "build",
    "image": "nixos/nix:2.24.14",
    "script": [
      "export VERSION=$(date +%Y.%m.%d)+${CI_COMMIT_SHORT_SHA}",
      "echo VERSION=$VERSION >> build.env",
      "nix build .#dockerImage",
      "cp result ${DOCKER_IMAGE_ARTIFACT}"
    ],
    "artifacts": {
      "paths": [
        "${DOCKER_IMAGE_ARTIFACT}"
      ],
      "reports": {
        "dotenv": "build.env"
      },
      "expire_in": "1 week"
    }
  },
  "release:release": {
    "stage": "release",
    "image": "registry.gitlab.com/gitlab-org/release-cli:latest",
    "rules": [
      {
        "if": '$ODIN_RELEASE_VERSION != null && $ODIN_RELEASE_VERSION != ""',
        "when": "on_success"
      }
    ],
    "needs": [
      {
        "job": "build:linux:release",
        "artifacts": true
      },
      {
        "job": "build:docker:image",
        "artifacts": true
      }
    ],
    "script": [
      "echo Creating release $VERSION for sacha.house"
    ],
    "release": {
      "name": "sacha.house $VERSION",
      "tag_name": "$VERSION",
      "description": "sacha.house automated release $VERSION",
      "assets": {
        "links": [
          {
            "name": "sacha.house Linux AMD64 Binary",
            "url": "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${ARTIFACT_NAME}?job=build:linux:release",
            "link_type": "package"
          },
          {
            "name": "sacha.house Docker Image",
            "url": "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${DOCKER_IMAGE_ARTIFACT}?job=build:docker:image",
            "link_type": "package"
          }
        ]
      }
    }
  },
  "release:nightly": {
    "stage": "release",
    "image": "registry.gitlab.com/gitlab-org/release-cli:latest",
    "rules": [
      {
        "if": '$ODIN_NIGHTLY_URL != null && $ODIN_NIGHTLY_URL != ""',
        "when": "on_success"
      }
    ],
    "needs": [
      {
        "job": "build:linux:nightly",
        "artifacts": true
      },
      {
        "job": "build:docker:image",
        "artifacts": true
      }
    ],
    "script": [
      'echo Creating nightly release $VERSION for sacha.house'
    ],
    "release": {
      "name": "sacha.house $VERSION",
      "tag_name": "$VERSION",
      "description": "sacha.house automated nightly release $VERSION",
      "assets": {
        "links": [
          {
            "name": "sacha.house Linux AMD64 Binary",
            "url": "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${ARTIFACT_NAME}?job=build:linux:nightly",
            "link_type": "package"
          },
          {
            "name": "sacha.house Docker Image",
            "url": "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${DOCKER_IMAGE_ARTIFACT}?job=build:docker:image",
            "link_type": "package"
          }
        ]
      }
    }
  }
}
