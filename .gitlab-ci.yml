{
  "stages": [
    "build",
    "release"
  ],
  "workflow": {
    "rules": [
      {
        "if": "$ODIN_RELEASE_VERSION != null && $ODIN_RELEASE_VERSION != \"\"",
        "when": "always"
      },
      {
        "if": "$ODIN_NIGHTLY_URL != null && $ODIN_NIGHTLY_URL != \"\"",
        "when": "always"
      },
      {
        "when": "never"
      }
    ]
  },
  "variables": {
    "ARTIFACT_NAME": "sacha.house-linux-amd64",
    "ODIN_RELEASE_VERSION": "",
    "ODIN_NIGHTLY_URL": "https://f001.backblazeb2.com/file/odin-binaries/nightly/odin-linux-amd64-nightly%2B2026-01-28.tar.gz",
    "BUN_VERSION": "1.3.1"
  },
  "build:linux:release": {
    "stage": "build",
    "image": "archlinux:base-devel",
    "rules": [
      {
        "if": "$ODIN_RELEASE_VERSION != null && $ODIN_RELEASE_VERSION != \"\"",
        "when": "on_success"
      }
    ],
    "before_script": [
      "pacman -Syu --noconfirm clang openssl make libbacktrace git unzip tar curl",
      "curl -L https://github.com/odin-lang/Odin/releases/download/${ODIN_RELEASE_VERSION}/odin-linux-amd64-${ODIN_RELEASE_VERSION}.tar.gz -o odin.tar.gz",
      "tar -C /opt -xzf odin.tar.gz",
      "ln -s $(find /opt -maxdepth 1 -type d -name \"odin-linux-amd64*\" | head -n 1)/odin /usr/local/bin/odin",
      "curl -fsSL https://bun.sh/install | bash -s \"bun-v${BUN_VERSION}\"",
      "export PATH=\"/root/.bun/bin:$PATH\""
    ],
    "script": [
      "export VERSION=\"$(date +%Y.%m.%d)+${CI_COMMIT_SHORT_SHA}\"",
      "echo \"VERSION=$VERSION\" >> build.env",
      "bun install --production",
      "make build mode=release GIT_COMMIT_HASH=$CI_COMMIT_SHORT_SHA VERSION=$VERSION",
      "mv sacha.house.exe ${ARTIFACT_NAME}",
      "chmod +x ${ARTIFACT_NAME}"
    ],
    "artifacts": {
      "paths": [
        "${ARTIFACT_NAME}"
      ],
      "reports": {
        "dotenv": "build.env"
      },
      "expire_in": "1 week"
    }
  },
  "build:linux:nightly": {
    "stage": "build",
    "image": "archlinux:base-devel",
    "rules": [
      {
        "if": "$ODIN_NIGHTLY_URL != null && $ODIN_NIGHTLY_URL != \"\"",
        "when": "on_success"
      }
    ],
    "before_script": [
      "pacman -Syu --noconfirm clang openssl make libbacktrace git unzip tar curl",
      "curl -L \"${ODIN_NIGHTLY_URL}\" -o odin.tar.gz",
      "tar -C /opt -xzf odin.tar.gz",
      "ln -s $(find /opt -maxdepth 1 -type d -name \"odin-linux-amd64*\" | head -n 1)/odin /usr/local/bin/odin",
      "curl -fsSL https://bun.sh/install | bash -s \"bun-v${BUN_VERSION}\"",
      "export PATH=\"/root/.bun/bin:$PATH\""
    ],
    "script": [
      "export VERSION=\"$(date +%Y.%m.%d)-nightly+${CI_COMMIT_SHORT_SHA}\"",
      "echo \"VERSION=$VERSION\" >> build.env",
      "bun install --production",
      "make build mode=release GIT_COMMIT_HASH=$CI_COMMIT_SHORT_SHA VERSION=$VERSION",
      "mv sacha.house.exe ${ARTIFACT_NAME}",
      "chmod +x ${ARTIFACT_NAME}"
    ],
    "artifacts": {
      "paths": [
        "${ARTIFACT_NAME}"
      ],
      "reports": {
        "dotenv": "build.env"
      },
      "expire_in": "1 week"
    }
  },
  "release:release": {
    "stage": "release",
    "image": "registry.gitlab.com/gitlab-org/release-cli:latest",
    "rules": [
      {
        "if": "$ODIN_RELEASE_VERSION != null && $ODIN_RELEASE_VERSION != \"\"",
        "when": "on_success"
      }
    ],
    "needs": [
      {
        "job": "build:linux:release",
        "artifacts": true
      }
    ],
    "script": [
      "echo \"Creating release $VERSION for sacha.house\""
    ],
    "release": {
      "name": "sacha.house $VERSION",
      "tag_name": "$VERSION",
      "description": "sacha.house automated release $VERSION",
      "assets": {
        "links": [
          {
            "name": "sacha.house Linux AMD64 Binary",
            "url": "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${ARTIFACT_NAME}?job=build:linux:release",
            "link_type": "package"
          }
        ]
      }
    }
  },
  "release:nightly": {
    "stage": "release",
    "image": "registry.gitlab.com/gitlab-org/release-cli:latest",
    "rules": [
      {
        "if": "$ODIN_NIGHTLY_URL != null && $ODIN_NIGHTLY_URL != \"\"",
        "when": "on_success"
      }
    ],
    "needs": [
      {
        "job": "build:linux:nightly",
        "artifacts": true
      }
    ],
    "script": [
      "echo \"Creating nightly release $VERSION for sacha.house\""
    ],
    "release": {
      "name": "sacha.house $VERSION",
      "tag_name": "$VERSION",
      "description": "sacha.house automated nightly release $VERSION",
      "assets": {
        "links": [
          {
            "name": "sacha.house Linux AMD64 Binary",
            "url": "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${ARTIFACT_NAME}?job=build:linux:nightly",
            "link_type": "package"
          }
        ]
      }
    }
  }
}