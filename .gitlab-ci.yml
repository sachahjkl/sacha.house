{
  "stages": [
    "test",
    "build",
    "release"
  ],
  "workflow": {
    "rules": [
      {
        "if": '$CI_COMMIT_BRANCH == "master"',
        "when": "always"
      },
      {
        "when": "never"
      }
    ]
  },
  "variables": {
    "ARTIFACT_NAME": "sacha.house-linux-amd64",
    "DOCKER_IMAGE_ARTIFACT": "sacha.house-docker-image.tar.gz",
    "NIX_CONFIG": "experimental-features = nix-command flakes\naccept-flake-config = true"
  },
  "test:go": {
    "stage": "test",
    "image": "nixos/nix:2.32.8",
    "script": [
      "nix shell nixpkgs#go -c env CGO_ENABLED=0 go test ./..."
    ]
  },
  "build:linux:release": {
    "stage": "build",
    "image": "nixos/nix:2.32.8",
    "before_script": [
      "nix profile add nixpkgs#cachix",
      "export PATH=$HOME/.nix-profile/bin:$PATH",
      "cachix use sachahjkl",
      "if [ -n \"$CACHIX_AUTH_TOKEN\" ]; then cachix authtoken \"$CACHIX_AUTH_TOKEN\"; fi"
    ],
    "script": [
      "nix build .#default --out-link result-nix",
      "nix build .#linuxBinary --out-link result-linux",
      "if [ -n \"$CACHIX_AUTH_TOKEN\" ]; then nix path-info --recursive ./result-nix ./result-linux | cachix push sachahjkl; fi",
      "cp result-linux/${ARTIFACT_NAME} ${ARTIFACT_NAME}",
      "chmod +x ${ARTIFACT_NAME}",
      "export VERSION=$(./${ARTIFACT_NAME} --version)",
      'echo "VERSION=$VERSION" >> build.env',
      "sha256sum ${ARTIFACT_NAME} > ${ARTIFACT_NAME}.sha256",
      "export PACKAGE_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sacha.house/${VERSION}",
      "nix shell nixpkgs#curl -c curl --fail --show-error --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\" --upload-file ${ARTIFACT_NAME} ${PACKAGE_URL}/${ARTIFACT_NAME}",
      "nix shell nixpkgs#curl -c curl --fail --show-error --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\" --upload-file ${ARTIFACT_NAME}.sha256 ${PACKAGE_URL}/${ARTIFACT_NAME}.sha256"
    ],
    "artifacts": {
      "paths": [
        "${ARTIFACT_NAME}",
        "${ARTIFACT_NAME}.sha256"
      ],
      "reports": {
        "dotenv": "build.env"
      },
      "expire_in": "1 week"
    }
  },
  "build:docker:image": {
    "stage": "build",
    "image": "nixos/nix:2.32.8",
    "before_script": [
      "nix profile add nixpkgs#cachix",
      "export PATH=$HOME/.nix-profile/bin:$PATH",
      "cachix use sachahjkl",
      "if [ -n \"$CACHIX_AUTH_TOKEN\" ]; then cachix authtoken \"$CACHIX_AUTH_TOKEN\"; fi"
    ],
    "script": [
      "nix build .#dockerImage",
      "if [ -n \"$CACHIX_AUTH_TOKEN\" ]; then nix path-info --recursive ./result | cachix push sachahjkl; fi",
      "cp result ${DOCKER_IMAGE_ARTIFACT}",
      "export VERSION=$(nix eval --raw .#default.version)",
      "export PACKAGE_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sacha.house/${VERSION}",
      "nix shell nixpkgs#curl -c curl --fail --show-error --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\" --upload-file ${DOCKER_IMAGE_ARTIFACT} ${PACKAGE_URL}/${DOCKER_IMAGE_ARTIFACT}"
    ],
    "artifacts": {
      "paths": [
        "${DOCKER_IMAGE_ARTIFACT}"
      ],
      "expire_in": "1 week"
    }
  },
  "release:release": {
    "stage": "release",
    "image": "registry.gitlab.com/gitlab-org/release-cli:latest",
    "needs": [
      {
        "job": "build:linux:release",
        "artifacts": true
      },
      {
        "job": "build:docker:image",
        "artifacts": true
      }
    ],
    "script": [
      "echo Creating release $VERSION for sacha.house"
    ],
    "release": {
      "name": "sacha.house $VERSION",
      "tag_name": "$VERSION",
      "description": "sacha.house automated release $VERSION",
      "assets": {
        "links": [
          {
            "name": "sacha.house Linux AMD64 Binary",
            "url": "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sacha.house/${VERSION}/${ARTIFACT_NAME}",
            "link_type": "package"
          },
          {
            "name": "sacha.house Linux AMD64 SHA256",
            "url": "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sacha.house/${VERSION}/${ARTIFACT_NAME}.sha256",
            "link_type": "package"
          },
          {
            "name": "sacha.house Docker Image",
            "url": "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sacha.house/${VERSION}/${DOCKER_IMAGE_ARTIFACT}",
            "link_type": "package"
          }
        ]
      }
    }
  }
}
