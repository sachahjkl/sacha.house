{
  "stages": [
    "build",
    "release"
  ],
  "workflow": {
    "rules": [
      {
        "if": '$CI_COMMIT_BRANCH == "master"',
        "when": "always"
      },
      {
        "when": "never"
      }
    ]
  },
  "variables": {
    "ARTIFACT_NAME": "sacha.house-linux-amd64",
    "DOCKER_IMAGE_ARTIFACT": "sacha.house-docker-image.tar.gz",
    "ODIN_NIGHTLY_URL": "",
    "NIX_CONFIG": "experimental-features = nix-command flakes\naccept-flake-config = true"
  },
  "build:linux:release": {
    "stage": "build",
    "image": "nixos/nix:2.32.8",
    "before_script": [
      "nix profile add nixpkgs#cachix",
      "export PATH=$HOME/.nix-profile/bin:$PATH",
      "cachix use sachahjkl",
      "if [ -n \"$CACHIX_AUTH_TOKEN\" ]; then cachix authtoken \"$CACHIX_AUTH_TOKEN\"; fi"
    ],
    "script": [
      "export VERSION=$(tr -d '[:space:]' < VERSION)+${CI_COMMIT_SHORT_SHA}",
      'echo "VERSION=$VERSION" >> build.env',
      "nix build .#default --out-link result-nix",
      "nix build .#linuxBinary --out-link result-linux",
      "if [ -n \"$CACHIX_AUTH_TOKEN\" ]; then nix path-info --recursive result-nix result-linux | cachix push sachahjkl; fi",
      "cp result-linux/${ARTIFACT_NAME} ${ARTIFACT_NAME}",
      "chmod +x ${ARTIFACT_NAME}"
    ],
    "artifacts": {
      "paths": [
        "${ARTIFACT_NAME}"
      ],
      "reports": {
        "dotenv": "build.env"
      },
      "expire_in": "1 week"
    }
  },
  "build:linux:nightly": {
    "stage": "build",
    "image": "nixos/nix:2.32.8",
    "rules": [
      {
        "if": '$ODIN_NIGHTLY_URL != null && $ODIN_NIGHTLY_URL != ""',
        "when": "on_success"
      }
    ],
    "before_script": [
      "nix profile add nixpkgs#cachix",
      "export PATH=$HOME/.nix-profile/bin:$PATH",
      "cachix use sachahjkl",
      "if [ -n \"$CACHIX_AUTH_TOKEN\" ]; then cachix authtoken \"$CACHIX_AUTH_TOKEN\"; fi"
    ],
    "script": [
      "export VERSION=$(tr -d '[:space:]' < VERSION)-nightly+${CI_COMMIT_SHORT_SHA}",
      "echo VERSION=$VERSION >> build.env",
      "nix build .#default --out-link result-nix",
      "nix build .#linuxBinary --out-link result-linux",
      "if [ -n \"$CACHIX_AUTH_TOKEN\" ]; then nix path-info --recursive result-nix result-linux | cachix push sachahjkl; fi",
      "cp result-linux/${ARTIFACT_NAME} ${ARTIFACT_NAME}",
      "chmod +x ${ARTIFACT_NAME}"
    ],
    "artifacts": {
      "paths": [
        "${ARTIFACT_NAME}"
      ],
      "reports": {
        "dotenv": "build.env"
      },
      "expire_in": "1 week"
    }
  },
  "build:docker:image": {
    "stage": "build",
    "image": "nixos/nix:2.32.8",
    "before_script": [
      "nix profile add nixpkgs#cachix",
      "export PATH=$HOME/.nix-profile/bin:$PATH",
      "cachix use sachahjkl",
      "if [ -n \"$CACHIX_AUTH_TOKEN\" ]; then cachix authtoken \"$CACHIX_AUTH_TOKEN\"; fi"
    ],
    "script": [
      "export VERSION=$(tr -d '[:space:]' < VERSION)+${CI_COMMIT_SHORT_SHA}",
      "echo VERSION=$VERSION >> build.env",
      "nix build .#dockerImage",
      "if [ -n \"$CACHIX_AUTH_TOKEN\" ]; then nix path-info --recursive result | cachix push sachahjkl; fi",
      "cp result ${DOCKER_IMAGE_ARTIFACT}"
    ],
    "artifacts": {
      "paths": [
        "${DOCKER_IMAGE_ARTIFACT}"
      ],
      "reports": {
        "dotenv": "build.env"
      },
      "expire_in": "1 week"
    }
  },
  "release:release": {
    "stage": "release",
    "image": "registry.gitlab.com/gitlab-org/release-cli:latest",
    "needs": [
      {
        "job": "build:linux:release",
        "artifacts": true
      },
      {
        "job": "build:docker:image",
        "artifacts": true
      }
    ],
    "script": [
      "echo Creating release $VERSION for sacha.house"
    ],
    "release": {
      "name": "sacha.house $VERSION",
      "tag_name": "$VERSION",
      "description": "sacha.house automated release $VERSION",
      "assets": {
        "links": [
          {
            "name": "sacha.house Linux AMD64 Binary",
            "url": "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${ARTIFACT_NAME}?job=build:linux:release",
            "link_type": "package"
          },
          {
            "name": "sacha.house Docker Image",
            "url": "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${DOCKER_IMAGE_ARTIFACT}?job=build:docker:image",
            "link_type": "package"
          }
        ]
      }
    }
  },
  "release:nightly": {
    "stage": "release",
    "image": "registry.gitlab.com/gitlab-org/release-cli:latest",
    "rules": [
      {
        "if": '$ODIN_NIGHTLY_URL != null && $ODIN_NIGHTLY_URL != ""',
        "when": "on_success"
      }
    ],
    "needs": [
      {
        "job": "build:linux:nightly",
        "artifacts": true
      },
      {
        "job": "build:docker:image",
        "artifacts": true
      }
    ],
    "script": [
      'echo Creating nightly release $VERSION for sacha.house'
    ],
    "release": {
      "name": "sacha.house $VERSION",
      "tag_name": "$VERSION",
      "description": "sacha.house automated nightly release $VERSION",
      "assets": {
        "links": [
          {
            "name": "sacha.house Linux AMD64 Binary",
            "url": "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${ARTIFACT_NAME}?job=build:linux:nightly",
            "link_type": "package"
          },
          {
            "name": "sacha.house Docker Image",
            "url": "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${DOCKER_IMAGE_ARTIFACT}?job=build:docker:image",
            "link_type": "package"
          }
        ]
      }
    }
  }
}
